# GPU-Orc config: copy to ~/.config/gpu-orc/config.yaml and adapt.
# Listening only on loopback needs no token. To let other machines ask, listen on their network and set
# token_file (a file with one random line, readable by the service user only).
listen:
  host: 127.0.0.1
  port: 5070
# token_file: ~/.config/gpu-orc/token

# Longest a /free request may take from its arrival, waiting in the queue included. Callers set their HTTP
# timeout to at least this plus 30 s (GET /health reports both).
free_timeout_s: 180

# How long a model that was cleared for counts as loading after /free ended (GET /loading), until its
# model server says so itself.
# load_grace_s: 15

# After a release GPU-Orc checks it: the service no longer reports the item, and the GPU memory went down
# (by half of what the service reported for it, or by min_freed_mib over its cards where it reported
# nothing, at most what was in use there before). It measures again until verify_timeout_s, within
# free_timeout_s. Failing = not_freed.
# verify_timeout_s: 30
# min_freed_mib: 256

# Where the hold of the cards is kept (POST /hold, DELETE /hold); it outlasts a restart.
# hold_file: ~/.local/state/gpu-orc/hold.json

consumers:
  # Services with the suites' common release API (GET /gpu/holders, POST /gpu/release).
  - name: stt-suite
    type: gpu-release
    url: http://127.0.0.1:5080
    busy_wait_s: 30           # wait this long for a running transcription (a dictation is done in seconds)
    force_after_wait: true    # then have the service end it (device=auto goes on on the CPU)

  - name: tts-suite
    type: gpu-release
    url: http://127.0.0.1:5090
    busy_wait_s: 5            # wait this long for a reading that holds an engine or a start
    force_after_wait: true    # then have the service abort it (reading_aborted) and stop the container

  - name: llama-swap
    type: llama-swap
    url: http://127.0.0.1:11435
    config_file: ~/.config/llama-swap/config.yaml
    # Models that keep room for the persistent ones by calibration and evict nothing.
    no_eviction_models: ["*-vlm-*"]

  # On a machine whose TTS containers another machine's TTS-Suite starts (its "hosts"): that suite reports
  # and stops them. It listens beyond loopback there, so every request needs its token.
  # - name: tts-remote
  #   type: tts-suite-remote
  #   url: http://192.168.1.10:5090
  #   host: Workstation           # this machine's name in that suite's hosts
  #   token_file: ~/.config/gpu-orc/tts-suite.token
  #   busy_wait_s: 30             # wait this long for a reading that holds a container
